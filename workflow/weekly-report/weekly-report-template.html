<!DOCTYPE html>
<!--
  通用周报模板
  使用方法：
  1. 复制到 reports/YYYY-MM-DD/weekly-report.html
  2. 替换所有 [方括号] 内的占位文字
  3. 调整进度条宽度（width="X" 中 X = 320 × percent）
  4. 同步 SVG 内容与下方 <pre id="md-content"> 内容（双写）
  5. 渲染：见 SKILL.md 末尾的 Chrome headless 命令
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #f3f4f6; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="880" height="820" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="840" height="780" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="840" height="780" rx="14" ry="14"
        fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>

  <g clip-path="url(#cardClip)">
    <rect x="20" y="20" width="840" height="62" fill="#1e3a8a"/>
  </g>
  <text x="50" y="58" fill="white" font-size="22" font-weight="600">周报 · YYYY-MM-DD</text>
  <text x="830" y="58" fill="#bfdbfe" font-size="14" text-anchor="end">[项目 / 主单号]</text>

  <!-- Section 1: 总目标 -->
  <g transform="translate(50, 110)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1e3a8a">1.  总目标</text>
    <text x="0" y="30" font-size="17" fill="#111827">[一句话目标，如：X 月 X 日完成 XXX 开发]</text>

    <g transform="translate(0, 62)">
      <text x="0" y="10" font-size="13" fill="#6b7280">总目标进度</text>
      <rect x="86" y="0" width="320" height="14" rx="7" fill="#e5e7eb"/>
      <!-- fill width: 320 × percent. 例：30% → 96, 50% → 160, 72% → 230 -->
      <rect x="86" y="0" width="96" height="14" rx="7" fill="#10b981"/>
      <text x="416" y="11" font-size="13" font-weight="700" fill="#047857">~30%</text>
    </g>
  </g>

  <!-- Section 2: 本月 -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1e3a8a">2.  本月（X 月）</text>

    <g transform="translate(0, 30)">
      <text x="0" y="10" font-size="13" fill="#6b7280">本月任务</text>
      <rect x="86" y="0" width="320" height="14" rx="7" fill="#e5e7eb"/>
      <rect x="86" y="0" width="230" height="14" rx="7" fill="#f59e0b"/>
      <text x="416" y="11" font-size="13" font-weight="700" fill="#92400e">~72%</text>
    </g>
    <g transform="translate(0, 56)">
      <text x="0" y="10" font-size="13" fill="#6b7280">本月时间</text>
      <rect x="86" y="0" width="320" height="14" rx="7" fill="#e5e7eb"/>
      <rect x="86" y="0" width="230" height="14" rx="7" fill="#3b82f6"/>
      <text x="416" y="11" font-size="13" font-weight="700" fill="#1d4ed8">~72%</text>
    </g>
    <!-- 节奏判断：根据任务 vs 时间差距填写 -->
    <text x="86" y="100" font-size="13" fill="#047857" font-style="italic">[节奏判断，如：节奏对齐，按计划推进 / 时间走在前面 X%，本周需追赶]</text>

    <g font-size="15" fill="#374151">
      <text x="0" y="134">[本月主题描述，1 句话]</text>
      <text x="0" y="164">本周完成：[1-3 件本周做完的事]。</text>
    </g>
  </g>

  <!-- Section 3: 下周 -->
  <g transform="translate(50, 430)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1e3a8a">3.  下周（M/D – M/D）</text>
    <text x="0" y="30" font-size="15" font-weight="700" fill="#111827">一句话：[一句话目标]</text>
    <g font-size="15" fill="#374151">
      <text x="0" y="62">·  [动作 1，带日期 / 验收点]</text>
      <text x="0" y="88">·  [动作 2]</text>
      <text x="0" y="114">·  [动作 3]</text>
      <text x="0" y="140">·  [动作 4]</text>
      <text x="0" y="166">·  [动作 5]</text>
    </g>
  </g>

  <!-- Section 4: 风险 -->
  <g transform="translate(50, 640)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1e3a8a">4.  风险</text>
    <g font-size="15" fill="#374151">
      <text x="0" y="32">·  [风险 1，带应对动作]</text>
      <text x="0" y="80">·  [风险 2，带应对动作 — 长内容换行示例：第一行写到这里然后</text>
      <text x="22" y="104">第二行继续，注意缩进 22 对齐]</text>
    </g>
  </g>

  <line x1="50" y1="760" x2="830" y2="760" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="788" font-size="12" fill="#9ca3af">数据源：[工单系统 / 文档路径 / 其他来源]</text>
  <text x="830" y="788" font-size="12" fill="#9ca3af" text-anchor="end">本周报截止 YYYY-MM-DD</text>
</svg>

<!-- Markdown copy block: 在 SVG 之外，不会进入 Chrome headless 截图 (window-size=880,820) -->
<div style="max-width: 840px; margin: 30px auto; padding: 0 20px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
    <h3 style="margin: 0; font-size: 16px; color: #1e3a8a;">📋 Markdown 文字版（评论 / 邮件 / IM）</h3>
    <div>
      <span id="copy-status" style="color: #10b981; font-size: 14px; margin-right: 12px;"></span>
      <button onclick="copyMd()" style="padding: 8px 16px; background: #1e3a8a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">复制 Markdown</button>
    </div>
  </div>
  <pre id="md-content" style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #e5e7eb; font-size: 14px; line-height: 1.7; white-space: pre-wrap; font-family: 'PingFang SC', -apple-system, sans-serif; color: #1f2937; margin: 0;"># 周报 · YYYY-MM-DD

## 1. 总目标

[一句话目标，如：X 月 X 日完成 XXX 开发]。当前进度约 X%。

## 2. 本月（X 月）

- 本月任务 ~X%
- 本月时间 ~Y%
- [节奏判断]

[本月主题描述]

本周完成：[本周完成的事]。

## 3. 下周（M/D – M/D）

**一句话：[一句话目标]**

- [动作 1，带日期]
- [动作 2]
- [动作 3]
- [动作 4]
- [动作 5]

## 4. 风险

- [风险 1，带应对动作]
- [风险 2，带应对动作]
</pre>
</div>

<script>
function copyMd() {
  const text = document.getElementById('md-content').innerText;
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  const s = document.getElementById('copy-status');
  if (ok) {
    s.textContent = '已复制 ✓';
    s.style.color = '#10b981';
  } else {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => { s.textContent = '已复制 ✓'; s.style.color = '#10b981'; })
        .catch(() => { s.textContent = '失败，请手动选择'; s.style.color = '#ef4444'; });
    } else {
      s.textContent = '失败，请手动选择';
      s.style.color = '#ef4444';
    }
  }
  setTimeout(() => { s.textContent = ''; }, 2500);
}
</script>
</body>
</html>
